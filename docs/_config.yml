title: 呼波特电话数字员工 Skill 文档
description: WhoBot whobot-phonecall-skill 的安装、各平台接入、使用旅程与协议参考。
lang: zh-CN
url: https://whobot-com.github.io
baseurl: /openclaw-whobot-skill
# 官网是正式地址：GitHub Pages 这套的 canonical 也指向官网，官网版由 .github/workflows/docs-official.yml 构建
canonical_base: https://www.whobot.com/skills/docs
repo_url: https://github.com/whobot-com/openclaw-whobot-skill
upstream_url: https://github.com/whobot-ai/skills/tree/main/skills/whobot-phonecall-skill
skill_version: 2.0.5
cli_protocol: 2

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-sitemap
relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - scripts/
  - README.md
  - Gemfile
  - Gemfile.lock
